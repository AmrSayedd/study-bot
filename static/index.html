<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Companion</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; height: 100vh; display: flex;
    flex-direction: column; overflow: hidden;
  }

  /* Header */
  .header {
    background: #1e293b; padding: 12px 20px; border-bottom: 1px solid #334155;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .status-bar {
    display: flex; gap: 16px; font-size: 13px; color: #94a3b8; align-items: center;
  }
  .status-item { display: flex; align-items: center; gap: 4px; }
  .status-label { color: #64748b; }
  .badge {
    background: #334155; padding: 2px 8px; border-radius: 10px; font-size: 12px;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Chat area */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column;
    gap: 12px; scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

  .message {
    max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5;
    font-size: 14px; word-wrap: break-word; white-space: pre-wrap;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .message.user {
    background: #2563eb; color: #fff; align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .message.ai {
    background: #1e293b; color: #e2e8f0; align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .message.system {
    background: transparent; color: #64748b; align-self: center;
    font-size: 12px; font-style: italic;
  }

  /* Typing indicator */
  .typing {
    align-self: flex-start; background: #1e293b; padding: 10px 16px;
    border-radius: 12px; border-bottom-left-radius: 4px; display: none;
    animation: fadeIn 0.2s ease;
  }
  .typing.active { display: flex; gap: 4px; align-items: center; }
  .typing-dot {
    width: 8px; height: 8px; background: #64748b; border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* Input area */
  .input-area {
    background: #1e293b; padding: 12px 20px; border-top: 1px solid #334155;
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
  }
  .input-area input[type="text"] {
    flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    padding: 10px 14px; color: #e2e8f0; font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .input-area input[type="text"]:focus { border-color: #2563eb; }
  .input-area input[type="text"]::placeholder { color: #475569; }

  .btn {
    background: #2563eb; color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; cursor: pointer; transition: background 0.2s;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-icon {
    background: transparent; border: 1px solid #334155; border-radius: 8px;
    padding: 10px; cursor: pointer; color: #94a3b8; font-size: 18px; line-height: 1;
    transition: background 0.2s; display: flex; align-items: center;
  }
  .btn-icon:hover { background: #334155; }

  /* File upload */
  .file-input { display: none; }

  /* Message formatting */
  .message.ai strong { color: #60a5fa; }
  .message.ai p { margin: 4px 0; }
  .message.ai ul, .message.ai ol { margin: 4px 0; padding-left: 20px; }
  .message.ai code {
    background: #0f172a; padding: 1px 5px; border-radius: 4px; font-size: 13px;
  }

  /* Mobile */
  @media (max-width: 640px) {
    .message { max-width: 90%; }
    .header { flex-direction: column; gap: 8px; align-items: flex-start; }
    .status-bar { flex-wrap: wrap; gap: 8px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📚 Study Companion</h1>
  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">Course:</span>
      <span class="badge" id="course-badge">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">Lecture:</span>
      <span class="badge" id="lecture-badge">—</span>
    </div>
    <div class="status-item">
      <span class="status-label">Mode:</span>
      <span class="badge" id="mode-badge">daily</span>
    </div>
  </div>
</div>

<div class="chat-area" id="chat-area">
  <div class="message system">Welcome! I'm your AI study companion. Upload a lecture or start revising.</div>
</div>

<div class="input-area">
  <button class="btn-icon" id="upload-btn" title="Upload file">📎</button>
  <input type="file" class="file-input" id="file-input" accept=".pdf,.txt,.md,.jpg,.jpeg,.png,.webp,.bmp,.tiff">
  <input type="text" id="msg-input" placeholder="Ask something..." autofocus>
  <button class="btn" id="send-btn">Send</button>
</div>

<div class="typing" id="typing">
  <span class="typing-dot"></span>
  <span class="typing-dot"></span>
  <span class="typing-dot"></span>
</div>

<script>
const chatArea = document.getElementById('chat-area');
const msgInput = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const uploadBtn = document.getElementById('upload-btn');
const fileInput = document.getElementById('file-input');
const typing = document.getElementById('typing');
const courseBadge = document.getElementById('course-badge');
const lectureBadge = document.getElementById('lecture-badge');
const modeBadge = document.getElementById('mode-badge');

let isProcessing = false;

// Load session on startup
fetch('/api/session')
  .then(r => r.json())
  .then(data => updateState(data))
  .catch(() => {});

function updateState(state) {
  if (state.course) courseBadge.textContent = state.course;
  if (state.lecture) lectureBadge.textContent = state.lecture;
  if (state.mode) modeBadge.textContent = state.mode;
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  if (role === 'ai') {
    div.innerHTML = formatAI(text);
  } else {
    div.textContent = text;
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function formatAI(text) {
  const escaped = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escaped
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

function showTyping() { typing.classList.add('active'); }
function hideTyping() { typing.classList.remove('active'); }

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isProcessing) return;

  msgInput.value = '';
  isProcessing = true;
  sendBtn.disabled = true;

  addMessage(text, 'user');
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    hideTyping();
    addMessage(data.reply, 'ai');
    if (data.state) updateState(data.state);
  } catch (err) {
    hideTyping();
    addMessage('Error: could not reach server. Is local_app.py running?', 'system');
  }

  sendBtn.disabled = false;
  isProcessing = false;
  msgInput.focus();
}

async function uploadFile(file) {
  if (isProcessing) return;
  isProcessing = true;
  sendBtn.disabled = true;

  addMessage(`[Uploading: ${file.name}]`, 'system');
  showTyping();

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) {
      hideTyping();
      addMessage(`Error: ${data.error}`, 'system');
    } else {
      hideTyping();
      addMessage(data.reply, 'ai');
      if (data.state) updateState(data.state);
    }
  } catch (err) {
    hideTyping();
    addMessage('Error: upload failed. Is local_app.py running?', 'system');
  }

  sendBtn.disabled = false;
  isProcessing = false;
  msgInput.focus();
}

// Events
sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) {
    uploadFile(fileInput.files[0]);
    fileInput.value = '';
  }
});
</script>
</body>
</html>
